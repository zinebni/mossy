name: mossy
description: "Mossy — AI-Powered Nature Exploration & Discovery App. Look closer. Discover more."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Backend & Network
  supabase_flutter: ^2.18.1
  http: ^1.5.0
  flutter_dotenv: ^6.0.1

  # Maps & Location
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2

  # Device & Permissions
  image_picker: ^1.2.3
  permission_handler: ^11.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

  # UI & Animations
  flutter_svg: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.6.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/
    - assets/mascot/
    - assets/illustrations/
    - assets/icons/

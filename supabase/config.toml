# Supabase CLI Project Configuration
# File: supabase/config.toml

project_id = "mossy-nature-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["mossy://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

# Edge Functions Configuration
[functions.identify-plant]
verify_jwt = false # JWT validation handled inside function for guest/demo fallback support

[functions.generate-discovery-content]
verify_jwt = false

[functions.generate-missions]
verify_jwt = false

[functions.verify-mission]
verify_jwt = false

[functions.award-points]
verify_jwt = false

name: Build & Package Mossy Artifacts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Static Analysis & Unit Tests
  # ────────────────────────────────────────────────────────────────────────────
  analyze-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Configure Environment
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "PLANTNET_API_KEY=${{ secrets.PLANTNET_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "DEMO_MODE=false" >> .env
          else
            echo "DEMO_MODE=true" >> .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Analysis
        # --no-fatal-infos: deprecation warnings from third-party packages
        # are info-level and should not block CI
        run: flutter analyze --no-fatal-infos

      - name: Run Test Suite
        run: flutter test

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Build Android Release APK
  # ────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    needs: analyze-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Configure Environment
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "PLANTNET_API_KEY=${{ secrets.PLANTNET_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "DEMO_MODE=false" >> .env
          else
            echo "DEMO_MODE=true" >> .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android local.properties
        run: |
          mkdir -p android
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          fi

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mossy-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Build iOS .ipa Artifact
  # ────────────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    needs: analyze-and-test
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Configure Environment
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "PLANTNET_API_KEY=${{ secrets.PLANTNET_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "DEMO_MODE=false" >> .env
          else
            echo "DEMO_MODE=true" >> .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Release, Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into Installable .ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -y ../../../mossy-release.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mossy-ios-release-ipa
          path: mossy-release.ipa
          if-no-files-found: error
          retention-days: 14
